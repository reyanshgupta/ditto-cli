name: Publish and release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      crate_version: ${{ steps.version.outputs.crate_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches crate version
        id: version
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ditto-cli") | .version')"
          if [[ "v${crate_version}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match crate version ${crate_version}"
            exit 1
          fi
          echo "crate_version=${crate_version}" >> "$GITHUB_OUTPUT"

  # The release ships a binary for each platform, so the suite has to pass on
  # each platform before any of them is built.
  test:
    name: Test on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  publish:
    name: Publish to crates.io
    needs:
      - verify
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Asked of the registry directly. `cargo info` resolves the checked out
      # package instead, and because the tag always matches the crate version
      # it reported every release as already published and skipped it.
      - name: Check publication status
        id: published
        shell: bash
        env:
          CRATE_VERSION: ${{ needs.verify.outputs.crate_version }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'User-Agent: ditto-cli release workflow' \
            "https://crates.io/api/v1/crates/ditto-cli/${CRATE_VERSION}")"
          case "${status}" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "ditto-cli ${CRATE_VERSION} is already published"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered ${status} for ditto-cli ${CRATE_VERSION}"
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.published.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: steps.published.outputs.exists != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify
      - test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/ditto-cli-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            ditto-cli

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/ditto-cli.exe" `
            -DestinationPath "dist/ditto-cli-${env:RELEASE_TAG}-${{ matrix.target }}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - publish
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}"
          fi

  # Runs after the release so the formula can read the checksums from the
  # SHA256SUMS that release published, rather than recomputing them here and
  # risking a formula that describes archives nobody downloaded.
  homebrew:
    name: Update Homebrew tap
    needs:
      - verify
      - release
    runs-on: ubuntu-latest

    steps:
      # Deliberately checks out the ref the workflow is running from rather
      # than the release tag. The formula is rendered from a version number and
      # the checksums that release published, so it needs nothing from the
      # tag's own tree; pinning to the tag only means a tag cut before this
      # tooling existed, or before a fix to it, can never be rendered at all.
      - name: Check out the release tooling
        uses: actions/checkout@v7

      # The tap is a second repository, and GITHUB_TOKEN cannot push to it. A
      # release should not fail over an optional distribution channel, so a
      # missing token skips the update loudly instead of erroring.
      - name: Check for a tap token
        id: token
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -z "${TAP_TOKEN}" ]]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set; the Homebrew tap stays on its previous version"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the tap
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: reyanshgupta/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the formula
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          CRATE_VERSION: ${{ needs.verify.outputs.crate_version }}
        run: |
          mkdir -p tap/Formula
          ./.github/homebrew/render-formula.sh "${CRATE_VERSION}" > tap/Formula/ditto-cli.rb

      - name: Commit the formula
        if: steps.token.outputs.present == 'true'
        shell: bash
        working-directory: tap
        env:
          CRATE_VERSION: ${{ needs.verify.outputs.crate_version }}
        run: |
          # `git diff` sees nothing in a file Git is not yet tracking, so a tap
          # that has never carried the formula would call itself up to date and
          # push nothing. `status --porcelain` reports the untracked file too,
          # and stays empty only when the formula really is unchanged.
          if [[ -z "$(git status --porcelain -- Formula/ditto-cli.rb)" ]]; then
            echo "Formula is already at ${CRATE_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ditto-cli.rb
          git commit -m "ditto-cli ${CRATE_VERSION}"
          git push

  # npm reaches the people this tool is for: anyone running Claude Code or
  # Codex already has npm, and it is the one channel that covers macOS, Linux
  # and Windows at once. Runs after the release, and for the same reason the
  # tap does — the packages carry the archives the release published, checked
  # against the SHA256SUMS it wrote, so npm cannot serve a binary that nobody
  # downloading from anywhere else was given.
  npm:
    name: Publish to npm
    needs:
      - verify
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance is signed against the workflow's own OIDC identity, which is
      # what lets npm show the packages as built from this tag.
      id-token: write

    steps:
      # Checks out the ref the workflow is running from rather than the release
      # tag, on the same reasoning as the tap job above: the packages are
      # rendered from a version number and the archives the release published,
      # so pinning to the tag would only put a fix to this tooling out of reach
      # of every tag cut before it.
      - name: Check out the release tooling
        uses: actions/checkout@v7

      # GitHub's Node image still carries npm 10, which cannot exchange the
      # workflow's OIDC identity for an npm publishing token and falls through
      # to a 2FA-protected account token instead. Trusted publishing arrived in
      # 11.5.1, so the publisher supplies its own npm rather than depending on
      # when the runner image catches up.
      - name: Install npm with trusted publishing support
        shell: bash
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm" 'npm@^11.5.1'
          echo "${RUNNER_TEMP}/npm/bin" >> "${GITHUB_PATH}"

      # npm authenticates as this workflow rather than as a token: the packages
      # name `publish.yml` in this repository as their trusted publisher, and
      # the OIDC identity the runner mints is what proves it is really this
      # file running.
      - name: Report the npm that will publish
        shell: bash
        run: |
          echo "node $(node --version), npm $(npm --version)"
          if [[ "$(printf '%s\n11.5.1\n' "$(npm --version)" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "::error::npm $(npm --version) predates trusted publishing"
            exit 1
          fi

      # The token is a fallback, not the mechanism. npm reaches for an OIDC
      # environment before it reaches for a token, so this is what publishes a
      # package whose trusted publisher has not been configured yet — and it is
      # ignored entirely once one has. A release must not fail for the want of
      # it, so a missing token is written as an empty file and left to npm.
      - name: Write the npm token, if there is one
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "No NPM_TOKEN; publishing as this workflow through trusted publishing"
            : > "${HOME}/.npmrc"
            exit 0
          fi
          # Written unexpanded so the token reaches npm from the environment
          # rather than sitting in a file on the runner.
          cat > "${HOME}/.npmrc" <<'NPMRC'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          NPMRC

      - name: Download the release archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archives
          gh release download "${RELEASE_TAG}" \
            --dir archives \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify the archives against the release checksums
        shell: bash
        working-directory: archives
        run: sha256sum --check SHA256SUMS

      - name: Render the packages
        shell: bash
        env:
          CRATE_VERSION: ${{ needs.verify.outputs.crate_version }}
        run: ./.github/npm/render-packages.sh "${CRATE_VERSION}" archives npm-dist

      # The binary packages go first. The wrapper names them as optional
      # dependencies, so a wrapper on the registry ahead of them is a version
      # that installs and then has nothing to run.
      - name: Publish the packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CRATE_VERSION: ${{ needs.verify.outputs.crate_version }}
        run: |
          publish() {
            local directory="npm-dist/$1"
            local name
            name="$(node -p "require('./${directory}/package.json').name")"
            # A re-run from workflow_dispatch reaches packages that are already
            # up, and npm refuses to publish over a version rather than skip
            # it, so the registry is asked first.
            if npm view "${name}@${CRATE_VERSION}" version > /dev/null 2>&1; then
              echo "${name}@${CRATE_VERSION} is already published"
              return 0
            fi
            # The `./` is load-bearing. npm reads a bare `a/b` as the GitHub
            # shorthand for a repository, so without it npm goes looking for
            # github.com/npm-dist/ditto-cli-darwin-arm64 over SSH rather than
            # publishing the directory sitting right there.
            # `--provenance` is redundant under trusted publishing, which signs
            # an attestation on its own, and is the only way to get one on the
            # token fallback. Passing it always is what makes both paths leave
            # the same evidence behind.
            npm publish "./${directory}" --access public --provenance
          }

          publish ditto-cli-darwin-arm64
          publish ditto-cli-darwin-x64
          publish ditto-cli-linux-x64
          publish ditto-cli-win32-x64
          publish ditto-cli
